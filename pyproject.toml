[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pengy"
version = "1.2.5"
description = "Local-first AI agent with tools — GUI and CLI"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "Pat Wendorf", email = "dungeons@gmail.com"},
]
keywords = [
    "llm", "ai-agent", "openai", "ollama", "groq", "vllm",
    "openrouter", "chat", "cli", "qt6", "pyside6",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    # License auto-derived from project.license SPDX expression
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "openai>=1.0.0",
    "ddgs>=9.0.0",
]

[project.optional-dependencies]
gui = [
    "PySide6>=6.6.0",
    "markdown>=3.5",
    "pygments>=2.17.0",
]
cli = [
    "rich>=13.0.0",
]
web = [
    "flask>=3.0.0",
    "markdown>=3.5",
    "pygments>=2.17.0",
]
all = [
    "PySide6>=6.6.0",
    "flask>=3.0.0",
    "markdown>=3.5",
    "pygments>=2.17.0",
    "rich>=13.0.0",
]

[project.scripts]
pengy = "pengy.main:main"
pengy-cli = "pengy.cli.main:main"
pengy-web = "pengy.web.main:main"

[project.urls]
Homepage = "https://github.com/patw/Pengy"
Repository = "https://github.com/patw/Pengy"
"Bug Tracker" = "https://github.com/patw/Pengy/issues"
"Changelog" = "https://github.com/patw/Pengy/releases"

[tool.setuptools.packages.find]
include = ["pengy", "pengy.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "smoke: quick import-and-parse tests (no LLM needed)",
    "web: Flask web UI tests (no LLM needed)",
]

[tool.setuptools.package-data]
pengy = ["assets/*", "web/templates/*"]
