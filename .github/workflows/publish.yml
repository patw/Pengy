# Publish Pengy to PyPI on version tags
#
# Usage:
#   git tag v1.3.0 && git push --tags
#
# Requires: PyPI trusted publishing configured for patw/Pengy
#   https://docs.pypi.org/trusted-publishers/
#   One-time setup: add patw/Pengy as a trusted publisher on PyPI
#
name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Needed for creating GitHub Releases
      id-token: write   # Needed for trusted publishing (OIDC)
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: pip install build

      - name: Build source distribution and wheel
        run: python -m build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
          generate_release_notes: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
