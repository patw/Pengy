# Publish Pengy to PyPI on version tags
#
# Usage:
#   git tag v1.3.0 && git push --tags
#
# Requires: PyPI trusted publishing configured for patw/Pengy
#   https://docs.pypi.org/trusted-publishers/
#   One-time setup: add patw/Pengy as a trusted publisher on PyPI
#
name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Needed for creating GitHub Releases
      id-token: write   # Needed for trusted publishing (OIDC)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: pip install build

      - name: Build source distribution and wheel
        run: python -m build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
