name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with test deps
        run: |
          pip install -e ".[cli,web]" pytest

      - name: Verify dependency integrity
        run: pip check

      - name: Run tests
        run: |
          python -m pytest tests/ -v 2>&1

      - name: Entry-point smoke tests
        run: |
          pengy-cli --version 2>&1 | grep -q "^Pengy v" || (echo "FAIL: pengy-cli --version" && exit 1)
          pengy-cli --help 2>&1 | grep -qiE "usage|options" || (echo "FAIL: pengy-cli --help" && exit 1)
          pengy-web --version 2>&1 | grep -q "^Pengy v" || (echo "FAIL: pengy-web --version" && exit 1)
          pengy-web --help 2>&1 | grep -qiE "usage|options" || (echo "FAIL: pengy-web --help" && exit 1)
          echo "Entry-points OK"
