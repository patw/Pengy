# Quick sanity check on push/PR to main
# Ensures the package builds and the CLI can at least import
name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with all extras
        run: |
          pip install -e ".[all]"

      - name: Run tests
        run: |
          python -m pytest tests/ -v

      - name: Verify CLI imports
        run: |
          python -c "from pengy.cli.main import main; print('CLI imports OK')"
