<!DOCTYPE html>
<!-- data-bs-theme drives Bootstrap 5.3's built-in dark mode. Rendered server-side
     for explicit light/dark so it works with JS disabled; "system" is resolved by
     the inline script below (before first paint, so there's no light flash). -->
<html lang="en" data-bs-theme="{{ 'dark' if theme_mode == 'dark' else 'light' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>{% block title %}Pengy{% endblock %}</title>
  <link rel="icon" href="{{ url_for('favicon') }}" type="image/png" sizes="any">
  <script>
    (function () {
      var mode = {{ (theme_mode or 'system') | tojson }};
      function resolve() {
        return mode === 'system'
          ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          : mode;
      }
      document.documentElement.setAttribute('data-bs-theme', resolve());
      // Follow the OS live when set to "system"
      if (mode === 'system' && window.matchMedia) {
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () {
          document.documentElement.setAttribute('data-bs-theme', resolve());
        });
      }
    })();
  </script>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    /* ── Theme tokens ────────────────────────────────────────── */
    /* Everything else uses Bootstrap's own --bs-* vars, which already flip
       with data-bs-theme. These two are the extras we need: a surface for
       code/tool blocks and a colour for inline code. */
    :root, [data-bs-theme="light"] {
      --pengy-code-bg: #f6f8fa;
      --pengy-code-fg: #24292e;
      --pengy-inline-code-fg: #d63384;
    }
    [data-bs-theme="dark"] {
      --pengy-code-bg: #1c1f24;
      --pengy-code-fg: #d7dae0;
      --pengy-inline-code-fg: #ff8bc4;
    }

    /* ── Layout ──────────────────────────────────────────────── */
    html, body { height: 100%; }

    .app-shell {
      display: flex;
      flex-direction: column;
      height: 100vh;      /* fallback for browsers without dvh */
      height: 100dvh;     /* tracks the visible viewport as mobile toolbars show/hide */
    }

    .app-body {
      display: flex;
      flex: 1;
      min-height: 0; /* let the message pane shrink and own scrolling */
      overflow: hidden;
    }

    /* ── Sidebar / Offcanvas ─────────────────────────────────── */
    /* On md+ the offcanvas becomes a static sidebar column */
    @media (min-width: 768px) {
      body {
        display: flex;
        flex-direction: row;
      }
      #sidebarOffcanvas {
        position: relative !important;
        transform: none !important;
        visibility: visible !important;
        width: 260px !important;
        height: 100vh !important;
        height: 100dvh !important;
        flex-shrink: 0;
        border-right: 1px solid var(--bs-border-color);
        display: flex !important;
        flex-direction: column;
        z-index: auto !important;
        top: auto !important;
        bottom: auto !important;
        left: auto !important;
      }
      /* Prevent backdrop on desktop */
      #sidebarOffcanvas ~ .offcanvas-backdrop {
        display: none !important;
      }
      .app-shell {
        flex: 1;
        min-width: 0;
      }
    }

    /* Offcanvas is a direct child of body */
    #sidebarOffcanvas {
      /* Bootstrap handles mobile offcanvas defaults */
    }
    #sidebarOffcanvas .offcanvas-header {
      border-bottom: 1px solid var(--bs-border-color);
    }
    #sidebarOffcanvas .offcanvas-body {
      display: flex;
      flex-direction: column;
      padding: 0;
      overflow: hidden;
    }

    /* Hide offcanvas header on desktop (it's a static sidebar) */
    @media (min-width: 768px) {
      #sidebarOffcanvas .offcanvas-header { display: none; }
      #sidebarOffcanvas .offcanvas-body {
        padding: 0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
    }

    .chat-list {
      overflow-y: auto;
      flex: 1;
    }

    .chat-list-item {
      display: flex;
      align-items: center;
      padding: 0.5rem 0.75rem;
      border-radius: 6px;
      text-decoration: none;
      color: var(--bs-body-color);
      gap: 0.4rem;
      min-height: 44px; /* better tap target on mobile */
    }
    .chat-list-item:hover { background: var(--bs-secondary-bg); color: var(--bs-body-color); }
    .chat-list-item.active { background: var(--bs-tertiary-bg); }
    .chat-list-item .chat-title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 0.85rem;
      flex: 1;
    }
    .chat-list-item .delete-btn {
      opacity: 0;
      border: none;
      background: none;
      color: var(--bs-secondary-color);
      padding: 0.25rem 0.35rem;
      font-size: 0.8rem;
      flex-shrink: 0;
      min-width: 28px;
      min-height: 28px;
    }
    /* On touch devices, always show delete button */
    @media (hover: none) and (pointer: coarse) {
      .chat-list-item .delete-btn { opacity: 0.5; }
    }
    .chat-list-item:hover .delete-btn { opacity: 1; }
    .chat-list-item .delete-btn:hover { color: var(--bs-danger); }

    /* ── Messages ────────────────────────────────────────────── */
    .messages-area {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 1rem 0.75rem;
    }
    @media (min-width: 576px) {
      .messages-area { padding: 1.25rem 1rem; }
    }

    .msg-user {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 0.85rem;
    }
    .bubble-user {
      max-width: 85%;
      background: var(--bs-secondary-bg);
      border-radius: 18px 18px 4px 18px;
      padding: 0.6rem 1rem;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 0.9rem;
    }
    .attachment-grid { display:flex; flex-wrap:wrap; gap:.4rem; margin-bottom:.45rem; }
    .attachment-thumb { width:96px; height:96px; object-fit:cover; border-radius:6px; cursor:pointer; }
    .attachment-unavailable { font-size:.78rem; color:var(--bs-secondary-color); }
    @media (max-width: 575px) {
      .bubble-user { max-width: 92%; }
    }

    .msg-assistant {
      display: flex;
      justify-content: flex-start;
      margin-bottom: 0.85rem;
    }
    .bubble-assistant {
      max-width: 90%;
      background: var(--bs-tertiary-bg);
      border-radius: 4px 18px 18px 18px;
      padding: 0.75rem 1rem;
      font-size: 0.9rem;
      word-break: break-word;
    }
    @media (max-width: 575px) {
      .bubble-assistant { max-width: 96%; }
    }

    .msg-tool { margin-bottom: 0.5rem; }

    .tool-card {
      background: var(--bs-body-bg);
      border: 1px solid var(--bs-border-color);
      border-left: 3px solid #f9e2af;
      border-radius: 6px;
      padding: 0.5rem 0.75rem;
      max-width: 90%;
      font-size: 0.82rem;
    }
    @media (max-width: 575px) {
      .tool-card { max-width: 98%; }
    }
    .tool-card.declined { border-left-color: var(--bs-danger); }
    .tool-card.done     { border-left-color: var(--bs-success); }

    .tool-header {
      cursor: pointer;
      user-select: none;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .tool-summary {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
      font-size: 0.78rem;
    }

    .tool-args, .tool-output {
      background: var(--pengy-code-bg);
      border-radius: 4px;
      padding: 0.5rem 0.6rem;
      margin-top: 0.4rem;
      max-height: 250px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
      font-size: 0.78rem;
      color: var(--pengy-code-fg);
    }

    /* ── Thinking indicator ──────────────────────────────────── */
    .msg-thinking {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.85rem;
      color: var(--bs-secondary-color);
      font-size: 0.85rem;
    }

    /* ── Jump to bottom ──────────────────────────────────────── */
    /* Anchored to the input area and floated up over the message list, so it
       sits still while the messages scroll underneath it. */
    #jumpBottomBtn {
      position: absolute;
      right: 1rem;
      top: -3rem;
      z-index: 5;
      border-radius: 999px;
      width: 2.5rem;
      height: 2.5rem;
      padding: 0;
      display: none;
      box-shadow: 0 2px 8px rgba(0,0,0,.25);
    }
    #jumpBottomBtn.show { display: block; }

    /* ── Input area ──────────────────────────────────────────── */
    .input-area {
      position: relative;
      padding: 0.6rem 0.75rem;
      border-top: 1px solid var(--bs-border-color);
      background: var(--bs-body-bg);
      /* safe area for notched phones; max() keeps at least the base padding */
      padding-bottom: max(0.6rem, env(safe-area-inset-bottom, 0px));
    }
    @media (min-width: 576px) {
      .input-area { padding: 0.75rem 1rem; }
    }
    #messageInput {
      resize: none;
      max-height: 180px;
      overflow-y: auto;
      font-size: 16px; /* prevent iOS zoom on focus */
    }

    /* ── Markdown body ───────────────────────────────────────── */
    .markdown-body { line-height: 1.6; }
    .markdown-body p { margin-bottom: 0.5rem; }
    .markdown-body p:last-child { margin-bottom: 0; }
    .markdown-body h1,.markdown-body h2,.markdown-body h3 { margin-top:0.75rem; margin-bottom:0.4rem; }
    .markdown-body pre {
      background: var(--pengy-code-bg);
      color: var(--pengy-code-fg);
      border-radius: 4px;
      padding: 0.75rem;
      overflow-x: auto;
    }
    .markdown-body code { font-size: 0.84em; }
    .markdown-body :not(pre)>code {
      background: var(--pengy-code-bg);
      color: var(--pengy-inline-code-fg);
      padding: 0.1em 0.3em;
      border-radius: 3px;
    }
    .markdown-body table { width:100%; border-collapse:collapse; margin-bottom:0.5rem; }
    .markdown-body th,.markdown-body td { border:1px solid var(--bs-border-color); padding:0.25rem 0.5rem; }
    .markdown-body ul,.markdown-body ol { padding-left:1.5rem; margin-bottom:0.5rem; }
    .markdown-body blockquote {
      border-left: 3px solid var(--bs-border-color);
      margin: 0.5rem 0;
      padding-left: 0.75rem;
      color: var(--bs-secondary-color);
    }

    /* ── Token usage ─────────────────────────────────────────── */
    .usage-line { font-size: 0.75rem; color: var(--bs-secondary-color); margin-top: 0.4rem; }

    {% block extra_style %}{% endblock %}
  </style>
</head>
<body>

  <!-- ── Sidebar Offcanvas ────────────────────────────────────── -->
  <!-- Direct child of body for proper Bootstrap offcanvas behavior on mobile.
       On md+ screens, CSS converts this into a static sidebar column. -->
  <div class="offcanvas offcanvas-start" tabindex="-1" id="sidebarOffcanvas"
       aria-labelledby="sidebarTitle">
    <div class="offcanvas-header">
      <h6 class="offcanvas-title fw-bold mb-0" id="sidebarTitle">🐧 Pengy</h6>
      <button type="button" class="btn-close"
              data-bs-dismiss="offcanvas"
              aria-label="Close"></button>
    </div>
    <div class="offcanvas-body">
      <div class="p-2">
        <form action="{{ url_for('new_chat') }}" method="post">
          <button type="submit" class="btn btn-outline-primary w-100"
                  data-bs-dismiss="offcanvas">
            <i class="bi bi-plus-lg"></i> New Chat
          </button>
        </form>
      </div>
      <div class="chat-list px-2 pb-2">
        {% block sidebar_chats %}{% endblock %}
      </div>
      <div class="mt-auto border-top p-2">
        <a href="{{ url_for('settings_view') }}" class="btn btn-outline-secondary w-100"
           onclick="dismissSidebar(event)">
          <i class="bi bi-gear me-1"></i> Settings
        </a>
      </div>
    </div>
  </div>

  <!-- ── App Shell ────────────────────────────────────────────── -->
  <div class="app-shell">

    <!-- ── Navbar ─────────────────────────────────────────────── -->
    <nav class="navbar bg-body-tertiary border-bottom px-2 py-2 flex-shrink-0">
      <!-- Left group -->
      <div class="d-flex align-items-center gap-1">
        <button class="btn btn-outline-secondary d-md-none"
                type="button"
                data-bs-toggle="offcanvas"
                data-bs-target="#sidebarOffcanvas"
                aria-label="Open sidebar">
          <i class="bi bi-list"></i>
        </button>
        <span class="fw-bold text-nowrap">🐧 Pengy</span>
        <form action="{{ url_for('new_chat') }}" method="post" class="d-md-none ms-1">
          <button type="submit" class="btn btn-outline-primary" title="New Chat"
                  aria-label="New Chat">
            <i class="bi bi-plus-lg"></i>
          </button>
        </form>
      </div>

      <!-- Right group -->
      <div class="d-flex align-items-center gap-1">
        {% block navbar_center %}{% endblock %}
        <a href="{{ url_for('settings_view') }}"
           class="btn btn-outline-secondary" aria-label="Settings">
          <i class="bi bi-gear"></i><span class="d-none d-sm-inline ms-1">Settings</span>
        </a>
      </div>
    </nav>

    <!-- ── Body ───────────────────────────────────────────────── -->
    <div class="app-body">
      <!-- Main content -->
      <div class="flex-grow-1 d-flex flex-column overflow-hidden">
        {% block main %}{% endblock %}
      </div>
    </div>

  </div><!-- /app-shell -->

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Dismiss offcanvas when clicking sidebar links (without blocking navigation).
    // Bootstrap's data-bs-dismiss="offcanvas" calls e.preventDefault() which kills
    // link hrefs — so we handle it ourselves instead.
    function dismissSidebar(event) {
      const offcanvas = document.getElementById('sidebarOffcanvas');
      if (!offcanvas) return;
      const bsOffcanvas = bootstrap.Offcanvas.getInstance(offcanvas);
      if (bsOffcanvas && offcanvas.classList.contains('show')) {
        event.preventDefault();
        bsOffcanvas.hide();
        // Wait for the offcanvas to close, then navigate
        offcanvas.addEventListener('hidden.bs.offcanvas', function() {
          window.location.href = event.currentTarget.href;
        }, { once: true });
      }
      // If sidebar is not shown (desktop mode), let the click navigate normally
    }

    document.addEventListener('click', function(e) {
      const link = e.target.closest('.chat-list-item');
      if (!link) return;
      const offcanvas = document.getElementById('sidebarOffcanvas');
      if (!offcanvas) return;
      const bsOffcanvas = bootstrap.Offcanvas.getInstance(offcanvas);
      if (bsOffcanvas && offcanvas.classList.contains('show')) {
        // On mobile the offcanvas is shown; hide it, but DON'T prevent default
        bsOffcanvas.hide();
      }
    });
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
